name: Refresh public repository charts
on:
  schedule:
    - cron: '37 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/activity.py
      - run: pip install fonttools
      - run: python3 scripts/compose.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/dashboard-montserrat-bold.svg
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public repository charts"
            git push
          fi
